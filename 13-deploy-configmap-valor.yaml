apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-config
  template:
    metadata:
      labels:
        app: app-config
    spec:
      containers:
      - name: app-config
        image: kubedevio/app-variaveis-ambiente:v1
        ports:
        - containerPort: 3000
        env:
          - name: APP_NAME
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_NAME_CONFIG
          - name: APP_VERSION
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_VERSION_CONFIG
          - name: APP_AUTHOR
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: APP_AUTHOR_CONFIG
---
apiVersion: v1
kind: Service
metadata:
  name: app-config
spec:
  selector:
    app: app-config
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    name: http
    protocol: TCP
    nodePort: 30000

