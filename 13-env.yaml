apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-config
  template:
    metadata:
      labels:
        app: app-config
    spec:
      containers:
      - name: app-config
        image: kubedevio/app-variaveis-ambiente:v1
        ports:
        - containerPort: 3000
        env:
        - name: APP_NAME
          value: "Meu App Kubernetes"
        - name: APP_VERSION
          value: "5.0"
        - name: APP_AUTHOR
          value: "Fagner Geraldes Braga"
---
apiVersion: v1
kind: Service
metadata:
  name: app-config
spec:
  selector:
    app: app-config
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    name: http
    protocol: TCP
    nodePort: 30000